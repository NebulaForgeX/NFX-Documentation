name: nfx-documentation
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.


services:

  frontend:
    build:
      context: ./servers/frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/documentation/}
        BACKEND_HOST: ${BACKEND_HOST}
        BACKEND_PORT: ${BACKEND_PORT}
    container_name: NFX-Documentation-Frontend
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_FRONTEND}:80"
    restart: always
    expose:
      - "80"
    volumes:
      - ./books:/usr/share/nginx/html/books:ro
