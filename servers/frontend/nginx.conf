server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json text/markdown;

    # Traefik 把浏览器的 /documentation/ 改写成这里的 /nfx-documentation/ 。
    location ^~ /nfx-documentation/ {
        rewrite ^/nfx-documentation/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        types {
            text/html html htm;
            text/css css;
            text/javascript js mjs;
            application/javascript js mjs;
            application/json json;
            text/markdown md;
            text/plain map txt;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
            image/x-icon ico;
            font/woff2 woff2;
            font/woff woff;
        }
    }
}
