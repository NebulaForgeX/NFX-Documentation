server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json text/markdown;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /console/nfx-documentation {
        return 301 /console/nfx-documentation/;
    }

    location /console/nfx-documentation/ {
        try_files $uri $uri/ /console/nfx-documentation/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/console/nfx-documentation/books/.+\.md$ {
        default_type text/markdown;
        charset utf-8;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    error_page 404 /console/nfx-documentation/index.html;
}
